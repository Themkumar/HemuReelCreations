<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" font-family="Helvetica, Arial, sans-serif">
<rect width="980" height="620" rx="18" fill="#0F1115"/>
<text x="30" y="46" fill="#fff" font-size="24" font-weight="700" text-anchor="start">How a reel is cut</text>
<text x="30" y="70" fill="#AAB" font-size="14" font-weight="400" text-anchor="start">Every cut ends on a finished sentence. The video, the voice and the graphics move together.</text>
<text x="30" y="114" fill="#fff" font-size="18" font-weight="700" text-anchor="start">60-second reel</text>
<text x="196" y="114" fill="#AAB" font-size="13.5" font-weight="400" text-anchor="start">the normal reel</text>
<rect x="31" y="130" width="59.33333333333333" height="58" rx="10" fill="#E8302A" fill-opacity="0.22" stroke="#E8302A"/>
<text x="40" y="154" fill="#fff" font-size="14" font-weight="700" text-anchor="start">Hook</text>
<text x="40" y="174" fill="#AAB" font-size="12" font-weight="400" text-anchor="start">0-2 s</text>
<rect x="92.33333333333333" y="130" width="171.77777777777777" height="58" rx="10" fill="#1F6FEB" fill-opacity="0.22" stroke="#1F6FEB"/>
<text x="101.33333333333333" y="154" fill="#fff" font-size="14" font-weight="700" text-anchor="start">Context</text>
<text x="101.33333333333333" y="174" fill="#AAB" font-size="12" font-weight="400" text-anchor="start">who, where, why it matters</text>
<rect x="266.1111111111111" y="130" width="274.0" height="58" rx="10" fill="#8250DF" fill-opacity="0.22" stroke="#8250DF"/>
<text x="275.1111111111111" y="154" fill="#fff" font-size="14" font-weight="700" text-anchor="start">The point</text>
<text x="275.1111111111111" y="174" fill="#AAB" font-size="12" font-weight="400" text-anchor="start">the statement, complete</text>
<rect x="542.1111111111111" y="130" width="100.22222222222221" height="58" rx="10" fill="#3DDC6A" fill-opacity="0.22" stroke="#3DDC6A"/>
<text x="551.1111111111111" y="154" fill="#fff" font-size="14" font-weight="700" text-anchor="start">Payoff</text>
<text x="551.1111111111111" y="174" fill="#AAB" font-size="12" font-weight="400" text-anchor="start">last line + stamp</text>
<line x1="30.0" y1="194" x2="30.0" y2="200" stroke="#555"/>
<text x="30.0" y="214" fill="#777" font-size="11" font-weight="400" text-anchor="middle">0s</text>
<line x1="183.33333333333331" y1="194" x2="183.33333333333331" y2="200" stroke="#555"/>
<text x="183.33333333333331" y="214" fill="#777" font-size="11" font-weight="400" text-anchor="middle">15s</text>
<line x1="336.66666666666663" y1="194" x2="336.66666666666663" y2="200" stroke="#555"/>
<text x="336.66666666666663" y="214" fill="#777" font-size="11" font-weight="400" text-anchor="middle">30s</text>
<line x1="489.99999999999994" y1="194" x2="489.99999999999994" y2="200" stroke="#555"/>
<text x="489.99999999999994" y="214" fill="#777" font-size="11" font-weight="400" text-anchor="middle">45s</text>
<line x1="643.3333333333333" y1="194" x2="643.3333333333333" y2="200" stroke="#555"/>
<text x="643.3333333333333" y="214" fill="#777" font-size="11" font-weight="400" text-anchor="middle">60s</text>
<line x1="796.6666666666666" y1="194" x2="796.6666666666666" y2="200" stroke="#555"/>
<text x="796.6666666666666" y="214" fill="#777" font-size="11" font-weight="400" text-anchor="middle">75s</text>
<line x1="949.9999999999999" y1="194" x2="949.9999999999999" y2="200" stroke="#555"/>
<text x="949.9999999999999" y="214" fill="#777" font-size="11" font-weight="400" text-anchor="middle">90s</text>
<text x="30" y="274" fill="#fff" font-size="18" font-weight="700" text-anchor="start">90-second story</text>
<text x="205" y="274" fill="#AAB" font-size="13.5" font-weight="400" text-anchor="start">only when it is one whole story</text>
<rect x="31" y="290" width="100.22222222222221" height="58" rx="10" fill="#E8302A" fill-opacity="0.22" stroke="#E8302A"/>
<text x="40" y="314" fill="#fff" font-size="14" font-weight="700" text-anchor="start">Cold open</text>
<text x="40" y="334" fill="#AAB" font-size="12" font-weight="400" text-anchor="start">a later line</text>
<rect x="133.22222222222223" y="290" width="120.66666666666666" height="58" rx="10" fill="#FFD400" fill-opacity="0.22" stroke="#FFD400"/>
<text x="142.22222222222223" y="314" fill="#fff" font-size="14" font-weight="700" text-anchor="start">Host asks</text>
<text x="142.22222222222223" y="334" fill="#AAB" font-size="12" font-weight="400" text-anchor="start">Hemu's question</text>
<rect x="255.88888888888889" y="290" width="386.4444444444444" height="58" rx="10" fill="#1F6FEB" fill-opacity="0.22" stroke="#1F6FEB"/>
<text x="264.8888888888889" y="314" fill="#fff" font-size="14" font-weight="700" text-anchor="start">The story, in order</text>
<text x="264.8888888888889" y="334" fill="#AAB" font-size="12" font-weight="400" text-anchor="start">suspense: each cut asks the next question</text>
<rect x="644.3333333333333" y="290" width="151.33333333333331" height="58" rx="10" fill="#8250DF" fill-opacity="0.22" stroke="#8250DF"/>
<text x="653.3333333333333" y="314" fill="#fff" font-size="14" font-weight="700" text-anchor="start">Turn</text>
<text x="653.3333333333333" y="334" fill="#AAB" font-size="12" font-weight="400" text-anchor="start">the twist</text>
<rect x="797.6666666666665" y="290" width="130.88888888888889" height="58" rx="10" fill="#3DDC6A" fill-opacity="0.22" stroke="#3DDC6A"/>
<text x="806.6666666666665" y="314" fill="#fff" font-size="14" font-weight="700" text-anchor="start">Payoff</text>
<text x="806.6666666666665" y="334" fill="#AAB" font-size="12" font-weight="400" text-anchor="start">answer + stamp</text>
<line x1="30.0" y1="354" x2="30.0" y2="360" stroke="#555"/>
<text x="30.0" y="374" fill="#777" font-size="11" font-weight="400" text-anchor="middle">0s</text>
<line x1="183.33333333333331" y1="354" x2="183.33333333333331" y2="360" stroke="#555"/>
<text x="183.33333333333331" y="374" fill="#777" font-size="11" font-weight="400" text-anchor="middle">15s</text>
<line x1="336.66666666666663" y1="354" x2="336.66666666666663" y2="360" stroke="#555"/>
<text x="336.66666666666663" y="374" fill="#777" font-size="11" font-weight="400" text-anchor="middle">30s</text>
<line x1="489.99999999999994" y1="354" x2="489.99999999999994" y2="360" stroke="#555"/>
<text x="489.99999999999994" y="374" fill="#777" font-size="11" font-weight="400" text-anchor="middle">45s</text>
<line x1="643.3333333333333" y1="354" x2="643.3333333333333" y2="360" stroke="#555"/>
<text x="643.3333333333333" y="374" fill="#777" font-size="11" font-weight="400" text-anchor="middle">60s</text>
<line x1="796.6666666666666" y1="354" x2="796.6666666666666" y2="360" stroke="#555"/>
<text x="796.6666666666666" y="374" fill="#777" font-size="11" font-weight="400" text-anchor="middle">75s</text>
<line x1="949.9999999999999" y1="354" x2="949.9999999999999" y2="360" stroke="#555"/>
<text x="949.9999999999999" y="374" fill="#777" font-size="11" font-weight="400" text-anchor="middle">90s</text>
<text x="30" y="440" fill="#fff" font-size="15" font-weight="700" text-anchor="start">Example: reel02 “One person changed everything” (88.75 s)</text>
<text x="30" y="466" fill="#AAB" font-size="13.5" font-weight="400" text-anchor="start" font-family="Menlo, monospace">0:00  cold open: “All the odds were against me ... I'll go back to India”</text>
<text x="30" y="488" fill="#AAB" font-size="13.5" font-weight="400" text-anchor="start" font-family="Menlo, monospace">0:08  Hemu asks: “What is this 'one good day' concept?”</text>
<text x="30" y="510" fill="#AAB" font-size="13.5" font-weight="400" text-anchor="start" font-family="Menlo, monospace">0:14  the story in order: 3000 rejection mails (the counter lands on 3000)</text>
<text x="30" y="532" fill="#AAB" font-size="13.5" font-weight="400" text-anchor="start" font-family="Menlo, monospace">0:31  the turn: Pietro, the one guy who believed in him</text>
<text x="30" y="554" fill="#AAB" font-size="13.5" font-weight="400" text-anchor="start" font-family="Menlo, monospace">1:00  “best suited guy for this job”, everything changed</text>
<text x="30" y="576" fill="#AAB" font-size="13.5" font-weight="400" text-anchor="start" font-family="Menlo, monospace">1:15  payoff: “all it took was one guy”, then the stamp</text>
</svg>
