<svg xmlns="http://www.w3.org/2000/svg" width="900" height="866" viewBox="0 0 900 866" font-family="Helvetica, Arial, sans-serif">
<rect width="900" height="866" rx="18" fill="#0F1115"/>
<text x="40" y="52" fill="#fff" font-size="28" font-weight="700" text-anchor="start">From podcast to 6 finished reels</text>
<rect x="560" y="34" width="16" height="16" rx="4" fill="#E8302A"/>
<text x="582" y="47" fill="#ccc" font-size="13" font-weight="700" text-anchor="start">You</text>
<rect x="670" y="34" width="16" height="16" rx="4" fill="#1F6FEB"/>
<text x="692" y="47" fill="#ccc" font-size="13" font-weight="700" text-anchor="start">Your Mac</text>
<rect x="780" y="34" width="16" height="16" rx="4" fill="#8250DF"/>
<text x="802" y="47" fill="#ccc" font-size="13" font-weight="700" text-anchor="start">Claude</text>
<line x1="66" y1="132" x2="66" y2="162" stroke="#333" stroke-width="3"/>
<circle cx="66" cy="110" r="22" fill="#E8302A"/>
<text x="66" y="117" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">1</text>
<rect x="104" y="84" width="760" height="54" rx="12" fill="#1A1D24" stroke="#E8302A" stroke-opacity="0.5"/>
<text x="124" y="107" fill="#fff" font-size="17" font-weight="700" text-anchor="start" font-family="Menlo, monospace">Put the episode in place</text>
<text x="124" y="128" fill="#AAB" font-size="14" font-weight="400" text-anchor="start">Video in Master copy, SRT in SUbtitles_Srt, paths in config.yaml</text>
<text x="848" y="107" fill="#E8302A" font-size="12" font-weight="700" text-anchor="end">YOU</text>
<line x1="66" y1="206" x2="66" y2="236" stroke="#333" stroke-width="3"/>
<circle cx="66" cy="184" r="22" fill="#1F6FEB"/>
<text x="66" y="191" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">2</text>
<rect x="104" y="158" width="760" height="54" rx="12" fill="#1A1D24" stroke="#1F6FEB" stroke-opacity="0.5"/>
<text x="124" y="181" fill="#fff" font-size="17" font-weight="700" text-anchor="start" font-family="Menlo, monospace">hrc ingest  /  hrc align  /  hrc realign</text>
<text x="124" y="202" fill="#AAB" font-size="14" font-weight="400" text-anchor="start">Subtitles, camera changes, faces, the exact time of every word</text>
<text x="848" y="181" fill="#1F6FEB" font-size="12" font-weight="700" text-anchor="end">YOUR MAC</text>
<line x1="66" y1="280" x2="66" y2="310" stroke="#333" stroke-width="3"/>
<circle cx="66" cy="258" r="22" fill="#1F6FEB"/>
<text x="66" y="265" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">3</text>
<rect x="104" y="232" width="760" height="54" rx="12" fill="#1A1D24" stroke="#1F6FEB" stroke-opacity="0.5"/>
<text x="124" y="255" fill="#fff" font-size="17" font-weight="700" text-anchor="start" font-family="Menlo, monospace">hrc select prepare</text>
<text x="124" y="276" fill="#AAB" font-size="14" font-weight="400" text-anchor="start">Writes the transcript and the brief into cache/select/</text>
<text x="848" y="255" fill="#1F6FEB" font-size="12" font-weight="700" text-anchor="end">YOUR MAC</text>
<line x1="66" y1="354" x2="66" y2="384" stroke="#333" stroke-width="3"/>
<circle cx="66" cy="332" r="22" fill="#8250DF"/>
<text x="66" y="339" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">4</text>
<rect x="104" y="306" width="760" height="54" rx="12" fill="#1A1D24" stroke="#8250DF" stroke-opacity="0.5"/>
<text x="124" y="329" fill="#fff" font-size="17" font-weight="700" text-anchor="start" font-family="Menlo, monospace">Pick the 6 strongest reels</text>
<text x="124" y="350" fill="#AAB" font-size="14" font-weight="400" text-anchor="start">reels_plan.json: rank, look, cuts, headline, graphics</text>
<text x="848" y="329" fill="#8250DF" font-size="12" font-weight="700" text-anchor="end">CLAUDE</text>
<line x1="66" y1="428" x2="66" y2="458" stroke="#333" stroke-width="3"/>
<circle cx="66" cy="406" r="22" fill="#E8302A"/>
<text x="66" y="413" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">5</text>
<rect x="104" y="380" width="760" height="54" rx="12" fill="#1A1D24" stroke="#E8302A" stroke-opacity="0.5"/>
<text x="124" y="403" fill="#fff" font-size="17" font-weight="700" text-anchor="start" font-family="Menlo, monospace">hrc select check  +  hrc approve</text>
<text x="124" y="424" fill="#AAB" font-size="14" font-weight="400" text-anchor="start">Read the list, approve. Nothing renders before this</text>
<text x="848" y="403" fill="#E8302A" font-size="12" font-weight="700" text-anchor="end">YOU</text>
<line x1="66" y1="502" x2="66" y2="532" stroke="#333" stroke-width="3"/>
<circle cx="66" cy="480" r="22" fill="#8250DF"/>
<text x="66" y="487" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">6</text>
<rect x="104" y="454" width="760" height="54" rx="12" fill="#1A1D24" stroke="#8250DF" stroke-opacity="0.5"/>
<text x="124" y="477" fill="#fff" font-size="17" font-weight="700" text-anchor="start" font-family="Menlo, monospace">hrc translate prepare / build</text>
<text x="124" y="498" fill="#AAB" font-size="14" font-weight="400" text-anchor="start">Claude writes the English, the Mac builds the caption files</text>
<text x="848" y="477" fill="#8250DF" font-size="12" font-weight="700" text-anchor="end">CLAUDE</text>
<line x1="66" y1="576" x2="66" y2="606" stroke="#333" stroke-width="3"/>
<circle cx="66" cy="554" r="22" fill="#1F6FEB"/>
<text x="66" y="561" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">7</text>
<rect x="104" y="528" width="760" height="54" rx="12" fill="#1A1D24" stroke="#1F6FEB" stroke-opacity="0.5"/>
<text x="124" y="551" fill="#fff" font-size="17" font-weight="700" text-anchor="start" font-family="Menlo, monospace">hrc assets</text>
<text x="124" y="572" fill="#AAB" font-size="14" font-weight="400" text-anchor="start">HD photos (2400 px+) and a numbered sheet per reel</text>
<text x="848" y="551" fill="#1F6FEB" font-size="12" font-weight="700" text-anchor="end">YOUR MAC</text>
<line x1="66" y1="650" x2="66" y2="680" stroke="#333" stroke-width="3"/>
<circle cx="66" cy="628" r="22" fill="#E8302A"/>
<text x="66" y="635" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">8</text>
<rect x="104" y="602" width="760" height="54" rx="12" fill="#1A1D24" stroke="#E8302A" stroke-opacity="0.5"/>
<text x="124" y="625" fill="#fff" font-size="17" font-weight="700" text-anchor="start" font-family="Menlo, monospace">hrc render --reel reel01,reel02</text>
<text x="124" y="646" fill="#AAB" font-size="14" font-weight="400" text-anchor="start">Two reels at a time; you ask for the next two</text>
<text x="848" y="625" fill="#E8302A" font-size="12" font-weight="700" text-anchor="end">YOU</text>
<line x1="66" y1="724" x2="66" y2="754" stroke="#333" stroke-width="3"/>
<circle cx="66" cy="702" r="22" fill="#1F6FEB"/>
<text x="66" y="709" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">9</text>
<rect x="104" y="676" width="760" height="54" rx="12" fill="#1A1D24" stroke="#1F6FEB" stroke-opacity="0.5"/>
<text x="124" y="699" fill="#fff" font-size="17" font-weight="700" text-anchor="start" font-family="Menlo, monospace">hrc qa</text>
<text x="124" y="720" fill="#AAB" font-size="14" font-weight="400" text-anchor="start">Length, loudness, captions, faces -> qa_report.md</text>
<text x="848" y="699" fill="#1F6FEB" font-size="12" font-weight="700" text-anchor="end">YOUR MAC</text>
<circle cx="66" cy="776" r="22" fill="#E8302A"/>
<text x="66" y="783" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">10</text>
<rect x="104" y="750" width="760" height="54" rx="12" fill="#1A1D24" stroke="#E8302A" stroke-opacity="0.5"/>
<text x="124" y="773" fill="#fff" font-size="17" font-weight="700" text-anchor="start" font-family="Menlo, monospace">Polish in DaVinci Resolve</text>
<text x="124" y="794" fill="#AAB" font-size="14" font-weight="400" text-anchor="start">Import resolve_en/&lt;reel&gt;_en.fcpxml, change any layer, export</text>
<text x="848" y="773" fill="#E8302A" font-size="12" font-weight="700" text-anchor="end">YOU</text>
<text x="40" y="844" fill="#FFD400" font-size="14" font-weight="700" text-anchor="start">Steps 8 and 9 repeat in pairs, only when you ask: reel01+02, then reel04+08, then reel06+07.</text>
</svg>
