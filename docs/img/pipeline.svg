<circle cx="66" cy="776" r="22" fill="#1F6FEB"/><text x="66" y="783" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">10</text>
<rect x="104" y="750" width="760" height="54" rx="12" fill="#1A1D24" stroke="#1F6FEB" stroke-opacity="0.5"/>
<text x="124" y="773" fill="#fff" font-size="17" font-weight="700" font-family="Menlo, monospace">hrc qa</text>
