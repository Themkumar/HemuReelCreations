<rect x="104" y="676" width="760" height="54" rx="12" fill="#1A1D24" stroke="#1F6FEB" stroke-opacity="0.5"/>
<text x="124" y="699" fill="#fff" font-size="17" font-weight="700" font-family="Menlo, monospace">hrc render</text>
