<svg xmlns="http://www.w3.org/2000/svg" width="900" height="444" viewBox="0 0 900 444" font-family="Helvetica, Arial, sans-serif"><rect width="900" height="444" rx="18" fill="#0F1115"/><text x="40" y="52" fill="#FFFFFF" font-size="28" font-weight="700">The 6 reels of an episode, strongest first</text><rect x="40" y="72" width="14" height="14" rx="3" fill="#B8C0CC"/><text x="60" y="84" fill="#FFFFFF" font-size="14" font-weight="700">Classic</text><rect x="320" y="72" width="14" height="14" rx="3" fill="#FFE45C"/><text x="340" y="84" fill="#FFFFFF" font-size="14" font-weight="700">Glow</text><rect x="600" y="72" width="14" height="14" rx="3" fill="#E8252B"/><text x="620" y="84" fill="#FFFFFF" font-size="14" font-weight="700">Slab</text><line x1="653.6842105263158" y1="114" x2="653.6842105263158" y2="404" stroke="#2EA043" stroke-width="2" stroke-dasharray="6 5"/><text x="653.6842105263158" y="108" fill="#2EA043" font-size="12" text-anchor="middle">ideal ~60 s</text><line x1="830.5263157894736" y1="114" x2="830.5263157894736" y2="404" stroke="#E8252B" stroke-width="2" stroke-dasharray="6 5"/><text x="830.5263157894736" y="94" fill="#E8252B" font-size="12" text-anchor="end">max 90 s: complete stories</text><text x="40" y="148" fill="#AAB0BB" font-size="13" font-weight="700">#1 reel02</text><text x="40" y="164" fill="#FFFFFF" font-size="13">One person changed everything</text><rect x="300" y="134" width="523.2" height="28" rx="6" fill="#FFE45C"/><text x="815.2" y="153" fill="#111" font-size="13" font-weight="700" text-anchor="end">89 s</text><text x="40" y="194" fill="#AAB0BB" font-size="13" font-weight="700">#2 reel08</text><text x="40" y="210" fill="#FFFFFF" font-size="13">The CEO interview</text><rect x="300" y="180" width="510.5" height="28" rx="6" fill="#E8252B"/><text x="802.5" y="199" fill="#111" font-size="13" font-weight="700" text-anchor="end">87 s</text><text x="40" y="240" fill="#AAB0BB" font-size="13" font-weight="700">#3 reel01</text><text x="40" y="256" fill="#FFFFFF" font-size="13">3000 rejections in Italy</text><rect x="300" y="226" width="319.2" height="28" rx="6" fill="#E8252B"/><text x="611.2" y="245" fill="#111" font-size="13" font-weight="700" text-anchor="end">54 s</text><text x="40" y="286" fill="#AAB0BB" font-size="13" font-weight="700">#4 reel04</text><text x="40" y="302" fill="#FFFFFF" font-size="13">Italy was a beautiful mistake</text><rect x="300" y="272" width="513.4" height="28" rx="6" fill="#B8C0CC"/><text x="805.4" y="291" fill="#111" font-size="13" font-weight="700" text-anchor="end">87 s</text><text x="40" y="332" fill="#AAB0BB" font-size="13" font-weight="700">#5 reel07</text><text x="40" y="348" fill="#FFFFFF" font-size="13">No Italian, no coffee</text><rect x="300" y="318" width="288.7" height="28" rx="6" fill="#B8C0CC"/><text x="580.7" y="337" fill="#111" font-size="13" font-weight="700" text-anchor="end">49 s</text><text x="40" y="378" fill="#AAB0BB" font-size="13" font-weight="700">#6 reel06</text><text x="40" y="394" fill="#FFFFFF" font-size="13">Abroad isn't blingy</text><rect x="300" y="364" width="327.5" height="28" rx="6" fill="#FFE45C"/><text x="619.5" y="383" fill="#111" font-size="13" font-weight="700" text-anchor="end">56 s</text><text x="40" y="426" fill="#AAB0BB" font-size="12">Length of the spoken content; the brand ending adds about 2 s.</text></svg>