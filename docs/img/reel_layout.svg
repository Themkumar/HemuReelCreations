<svg xmlns="http://www.w3.org/2000/svg" width="820" height="750" viewBox="0 0 820 750" font-family="Helvetica, Arial, sans-serif"><rect width="820" height="750" rx="18" fill="#0F1115"/><text x="40" y="52" fill="#FFFFFF" font-size="28" font-weight="700">One reel, 1080 x 1920</text><rect x="30" y="80" width="360" height="640" rx="14" fill="#000" stroke="#333"/><circle cx="350" cy="120" r="20" fill="none" stroke="#fff" stroke-width="3"/><text x="350" y="124" fill="#fff" font-size="9" font-weight="700" text-anchor="middle">HEMU</text><text x="210.0" y="229.20000000000005" fill="#FFD400" font-size="26" font-weight="900" text-anchor="middle" font-family="Impact, Anton, sans-serif">3000 REJECTIONS</text><text x="210.0" y="263.20000000000005" fill="#fff" font-size="26" font-weight="900" text-anchor="middle" font-family="Impact, Anton, sans-serif">IN ITALY</text><rect x="30" y="291.20000000000005" width="360" height="202.47469066366705" fill="#3B4252"/><text x="210.0" y="449.13025871766035" fill="#E8252B" font-size="56" font-weight="900" text-anchor="middle" font-family="Impact, Anton, sans-serif">3,000</text><text x="210.0" y="479.50146231721044" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">REJECTIONS</text><circle cx="253.2" cy="368.14038245219353" r="26" fill="#D9A47A"/><rect x="205.2" y="402.56107986501695" width="96" height="91.11361079865017" rx="22" fill="#25324A"/><text x="210.0" y="545.6746906636671" fill="#fff" font-size="13" text-anchor="middle">in my</text><text x="210.0" y="581.6746906636671" fill="#FFD400" font-size="32" font-style="italic" font-weight="700" text-anchor="middle" font-family="Georgia, serif">résumé</text><line x1="396" y1="120" x2="430" y2="120" stroke="#E8252B" stroke-width="2"/><circle cx="396" cy="120" r="4" fill="#E8252B"/><text x="440" y="118" fill="#fff" font-size="16" font-weight="700">Corner logo</text><text x="440" y="136" fill="#AAB0BB" font-size="13">your stamp, outside the picture</text><line x1="396" y1="246.20000000000005" x2="430" y2="246.20000000000005" stroke="#E8252B" stroke-width="2"/><circle cx="396" cy="246.20000000000005" r="4" fill="#E8252B"/><text x="440" y="244.20000000000005" fill="#fff" font-size="16" font-weight="700">Headline</text><text x="440" y="262.20000000000005" fill="#AAB0BB" font-size="13">2 lines, key words coloured, outside the picture</text><line x1="396" y1="368.14038245219353" x2="430" y2="368.14038245219353" stroke="#E8252B" stroke-width="2"/><circle cx="396" cy="368.14038245219353" r="4" fill="#E8252B"/><text x="440" y="366.14038245219353" fill="#fff" font-size="16" font-weight="700">Video box</text><text x="440" y="384.14038245219353" fill="#AAB0BB" font-size="13">the full 16:9 podcast, steady framing, punch-ins</text><line x1="396" y1="443.05601799775036" x2="430" y2="443.05601799775036" stroke="#E8252B" stroke-width="2"/><circle cx="396" cy="443.05601799775036" r="4" fill="#E8252B"/><text x="440" y="441.05601799775036" fill="#fff" font-size="16" font-weight="700">Graphics behind you</text><text x="440" y="459.05601799775036" fill="#AAB0BB" font-size="13">words, big counters, photos at shoulder height;</text><text x="440" y="476.05601799775036" fill="#AAB0BB" font-size="13">the cut-out keeps you, the mic and the table in front</text><line x1="396" y1="563.6746906636671" x2="430" y2="563.6746906636671" stroke="#E8252B" stroke-width="2"/><circle cx="396" cy="563.6746906636671" r="4" fill="#E8252B"/><text x="440" y="561.6746906636671" fill="#fff" font-size="16" font-weight="700">Captions</text><text x="440" y="579.6746906636671" fill="#AAB0BB" font-size="13">in the reel's look (classic, glow or slab)</text><line x1="396" y1="680" x2="430" y2="680" stroke="#E8252B" stroke-width="2"/><circle cx="396" cy="680" r="4" fill="#E8252B"/><text x="440" y="678" fill="#fff" font-size="16" font-weight="700">Ending</text><text x="440" y="696" fill="#AAB0BB" font-size="13">stamp slams into the centre with a sound</text></svg>