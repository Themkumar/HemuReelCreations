# HemuReelCreations (HRC) settings. Every stage reads this file.
project:
  name: HemuReelCreations
  channel_name: "The Hemu Mark"
  logo: assets/brand/hemu_mark_stamp.png   # round "THE HEMU MARK" stamp (transparent PNG)
  logo_color: "#FFFFFF"     # stamp ink is recoloured to this so it reads on dark video
  logo_size: 0.15           # corner logo width, as a fraction of the picture's short side
  end_stamp_size: 0.58      # ending stamp width, as a fraction of the frame's short side
  brand_colors: ["#FFD400", "#E8252B"]   # [highlight word colour, accent colour (headline keywords, key words)]

input:
  video: "/Users/hemu/Desktop/Master copy/HemuXSrinadh_Part1.mp4"
  srt: "/Users/hemu/Desktop/SUbtitles_Srt/captions.srt"
  language: te

paths:
  cache: cache
  assets: assets
  subs: subs
  mattes: mattes
  renders: renders
  output: output

reel:
  width: 1080
  height: 1920
  fps: 30
  min_sec: 30
  max_sec: 60
  count_min: 10
  count_max: 10
  languages: [en]   # English captions only (the speech stays Telugu). Add te, hi, ta, kn to bring them back.
  formats: [reel]   # reel = 9:16 (full-screen close-up with layout.reel.fullbleed, else a wide box with a headline)
                    # also possible: landscape (plain 16:9 1920x1080), portrait (face-tracked 9:16 crop)

layout:
  reel:
    fullbleed: true         # v0.8: the speaker's close-up fills the 9:16 frame, like the reference reels
    video_aspect: 1.4       # width / height of the video box (16:9 source is cropped a little, steady tracking)
    video_top: 0.25         # top of the video box, as a fraction of the frame height
    headline_size: 124      # headline above the video (Anton for English, Noto Bold for Indic scripts)
    headline_chars: 20      # wrap the headline onto 2 lines past this many characters
    headline_gap: 0.025
    caption_gap: 0.03       # captions start this far below the video box

preview:
  width: 540
  height: 960
  crf: 28

align:
  engine: auto              # auto | whisperx | faster_whisper | proportional
  model: large-v3
  device: auto              # auto picks mps/cpu on Mac
  low_confidence: 0.45      # words below this go to cache/align_review.json

select:
  mode: chat                # chat = Claude picks reels in the project thread; api = call Anthropic API
  api_model: claude-opus-5-5
  chunk_minutes: 8

translate:
  mode: chat                # chat | api
  chunk_words: [3, 6]

subtitles:
  style: punch               # punch = reference-reel captions: small white words + the key word big in a
                             # glowing italic serif (mark it *like this* in the English text). classic = karaoke lines
  punch:
    lead_font: Inter SemiBold
    lead_size: 58            # small words, at 1080 wide
    hero_font: Playfair Hero # Playfair Display Bold Italic
    hero_size: 168
    hero_color: "#F4E73A"
    glow_color: "#E8D700"
    y: 0.6                   # small words' top, as a fraction of the height (chest level, under the face)
    max_words: 3             # words on screen at once (besides the key word)
  max_lines: 2               # line 2 appears under line 1 only when a sentence needs it
  max_chars: {te: 15, kn: 15, ta: 14, hi: 19, en: 21}   # longest line per language
  font_size: 100            # at 1080 wide (portrait)
  outline: 6
  bottom_safe: 0.22         # keep clear of bottom 22% (IG/Shorts UI)
  right_safe: 0.12          # keep clear of right edge
  y_position: 0.66          # subtitle centre, as a fraction of height
  base_color: "#FFFFFF"
  landscape: {y_position: 0.8, bottom_safe: 0.05, right_safe: 0.0, font_scale: 0.8}
  reel: {font_scale: 1.0, right_safe: 0.0}
  lead_sec: 0.05            # highlight this much before the word (feels in sync)
  hold_gap_sec: 0.6         # pauses shorter than this keep the caption on screen (no blinking)
  emoji: false
  fonts:
    te: Noto Sans Telugu
    hi: Noto Sans Devanagari
    ta: Noto Sans Tamil
    kn: Noto Sans Kannada
    en: Inter SemiBold

grade:                      # cinematic look on the podcast picture (darker room, deeper shadows, warm skin)
  enabled: true
  exposure: -0.18           # stops
  contrast: 1.15
  gamma: 1.1                # >1 deepens shadows
  saturation: 0.9
  warmth: 0.03
  vignette: 0.5             # darker edges (0.35 before v0.8)

reactions:                  # listener cutaways while the speaker talks (run `hrc reactions` once first)
  enabled: true
  length_sec: 1.5           # each one 1-2 s; never more than 2 s
  min_sec: 1.0
  max_sec: 2.0
  every_sec: 16             # about one every 16 s
  max_per_reel: 3
  first_after_sec: 6        # never in the opening hook
  head_room: 0.32
  push_in: 0.035            # slow push-in on the listener

reframe:
  smoothing_min_cutoff: 0.15  # One-Euro filter, lower = smoother
  smoothing_beta: 0.003
  deadzone: 0.12            # frame holds still while the face stays in this middle zone
  max_pan: 0.012            # max pan speed per frame, as a fraction of the crop width
  head_room: 0.30           # face centre sits this far down the frame
  punch_in_scale: 1.12      # zoom for emphasis words
  punch_in_frames: 6
  min_shot_sec: 0.4         # a camera angle shown for less than this is removed (no flash cuts)
  portrait_top_band: 0.0     # portrait: 0 = full-bleed close-up; 0.18 = video sits lower with a soft band above the head

matte:
  engine: auto              # auto | vision | rvm | mediapipe | none  (auto = Apple Vision on a Mac)
  downsample: 0.4
  temporal_smooth: 0.6
  objects: true             # also cut out the mic, cups, bottles and other things in front of you (macOS 14+)
  object_max_area: 0.22     # ignore "objects" bigger than this share of the picture (walls, the whole table)
  depth: true               # use a depth model to keep only objects as near as you or nearer
  refine_edges: true        # edge-aware clean-up of hair, hands and mic edges
  depth_objects: true       # also keep everything as near as you below your eye line (mic arm, mug, tabletop), found by depth
  depth_tolerance: -0.03    # negative = must be nearer than you (keeps your chair out); higher keeps more
  object_region_top: 0.15   # ignore things above this share of your height from the top of your head
  only_where_needed: true   # v0.8: cut out only the frames where a graphic sits behind you (+ handles)
  handle_sec: 0.3
  edge_refine_model: true   # high-detail edges (hair, fingers, mic arm) with BiRefNet on those frames
  edge_model: ZhengPeng7/BiRefNet-matting   # faster: ZhengPeng7/BiRefNet_lite

gfx:
  max_major_at_once: 1
  lead_frames: 1            # appear this many frames before the word
  snap_to_onset: true       # land on the frame where the word's sound starts (needs `hrc realign`)
  track: true               # graphics stay pinned to the room: they follow the reframing pans and zooms
  particles: false          # floating dots behind the speaker (off for the clean reference look)
  default_hold_sec: 2.2
  backdrop:                 # look of photos that replace the wall behind you
    blur: 0                 # 0 = crisp photo; 3-8 = soft, dreamy background
    dim: 0.22               # 0 = full brightness, 0.5 = half
    desaturate: 0.1         # 0 = full colour, 1 = black and white
    vignette: 0.3           # darker corners
    tint: 0.03              # faint brand-red wash
    push_in: 0.05           # slow zoom while the photo is on screen

transitions:
  library: [zoom_punch, hard, whip_pan]   # clean, editor-style joins. Flashier ones: glitch, rgb_split,
                                          # light_flash, spin, slide, shape_wipe, film_burn
  sfx: false                # joins stay silent; sound is saved for the key moments
  hard_cut_if_gap_under: 0.25

audio:
  target_lufs: -14
  music_db: -20
  duck_ratio: 8
  sfx_db: -8
  sfx_max: 4                # sound effects per reel (plus the ending stamp), only on the key moments
  sfx_min_gap: 5.0          # seconds between two sound effects
  speech_cleanup: true

export:
  codec: h264               # h264 | hevc
  hw_accel: auto            # auto uses VideoToolbox on Mac, libx264 elsewhere
  bitrate: 12M
  audio_bitrate: 320k
  clean_version: true
  phone_preview: true       # also a small <reel>_en_phone.mp4 (about 3 MB) to watch on a phone
  fcpxml: true
  resolve_pack: true        # layered pack for DaVinci Resolve: every graphic, caption, logo and sound on its own track
  resolve_langs: [en]

resolve:
  graphic_font: Anton       # font of the editable graphic text in Resolve (tracks V11 and up)
  graphic_size: 96       # languages to build packs for (each pack ~0.5-1 GB); `hrc resolve --lang en` adds more

assets:
  sources: [wikimedia, openverse, pexels, pixabay]   # free keys for Pexels/Pixabay give the best HD photos
  min_width: 2400           # skip photos narrower than this (backgrounds stay sharp on a 4K source)
  candidates: 5             # photos kept per moment; see assets/sheets/<reel>.jpg and set "pick": n to swap
  pexels_key_env: PEXELS_API_KEY
  pixabay_key_env: PIXABAY_API_KEY
  remove_background: true
